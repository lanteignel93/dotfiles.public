#──────────────────────────────────────────────────────────────────────────────
# GENERAL
#──────────────────────────────────────────────────────────────────────────────
# use zsh as default shell
set-option -g default-shell /bin/zsh

# enable true color support
set -g default-terminal "screen-256color"
# terminal-overrides matches the CLIENT's TERM — the emulator outside tmux — not
# default-terminal. So the old ",*256col*:Tc" never matched xterm-kitty and was
# dead config; truecolor worked here only because kitty's own terminfo carries
# Tc. xterm-256color's terminfo does not, so a terminal reporting that (e.g.
# alacritty, which pins TERM=xterm-256color) needs it declared explicitly or
# tmux downsamples 24-bit colour to the 256 palette. Listed by name rather than
# ",*:Tc" so we don't promise truecolor on behalf of a terminal that lacks it.
set -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc,alacritty:Tc"

# Let kitty's graphics protocol through tmux. Without this, images written by
# image.nvim (molten's inline plots) are swallowed by tmux and nothing renders.
# The option only exists in tmux >= 3.3; 3.2a (Ubuntu 22.04) errors on it when
# sourcing, so guard it by version. The test must ask the SERVER, not the binary:
# `tmux -V` reports whatever is first in PATH (~/.local/bin/tmux, 3.5a), while the
# running server can still be the distro's 3.2a from before the upgrade — which is
# what sources this file and what errors. #{version} is evaluated server-side and
# exists back to 3.2, so an even older server just fails the match and skips.
if -F '#{m/r:^(3\.[3-9]|3\.[1-9][0-9]|[4-9]\.),#{version}}' 'set -g allow-passthrough on'

# general settings
set -g set-clipboard on          # use system clipboard
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 2             # remove delay for exiting insert mode with ESC in Neovim
set -g focus-events on           # pass FocusGained/Lost to Neovim (autoread, gitsigns refresh)
set -g history-limit 5000        # increase history size
set -g mouse on                  # enable mouse support
set -g status-interval 3         # update the status bar every 3 seconds
set -g status-position top       # move status bar to the top

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#──────────────────────────────────────────────────────────────────────────────
# KEYMAPS
#──────────────────────────────────────────────────────────────────────────────
# refresh tmux config with r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# split horizontally in current path
bind | split-window -h -c "#{pane_current_path}"

# split vertically in current path
bind - split-window -v -c "#{pane_current_path}"

# new window in current path
bind c new-window -c "#{pane_current_path}"

# use vim arrow keys to resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize pane with m
bind -r m resize-pane -Z

# enable vi mode for buffer manipulations
set-window-option -g mode-keys vi

# start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# copy text with "y" (cross-platform)
# requires `xclip` on Linux. install with `sudo apt install xclip` or equivalent.
if-shell 'uname | grep -q Darwin' \
  "bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# paste yanked text with "P"
bind P paste-buffer

# don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

#──────────────────────────────────────────────────────────────────────────────
# THEME
#──────────────────────────────────────────────────────────────────────────────
# palette: rendered by ~/dotfiles/theme into the bundle `dye` points at; the
# theme_* variables below come from there
source-file -q ~/.config/theme/current/tmux.conf
# fallback until install.sh has created the link (harmless once it has: same variables)
if-shell '[ ! -r ~/.config/theme/current/tmux.conf ]' 'source-file -q ~/dotfiles/theme/build/voidrunner/tmux.conf'

# rounded chip caps (Powerline-extra glyphs — Nerd Font required)
chip_left=''
chip_right=''

# nerd font icons & separators
icon_cpu=''              # nf-fa-microchip
icon_mem='󰍛'              # nf-md-memory
icon_branch=''        # powerline branch
icon_host=''          # nf-fa-server — status-left host chip
sep_dot='·'                # middle dot
act_dot='•'                # bullet
icon_zoom='Z'                  # plain ASCII — swap to a glyph if you want

# status bar layout
set -g status-justify left
set -g status-style "fg=${theme_fg},bg=${theme_bg}"
set -g status-left-length 100
set -g status-right-length 160

# activity monitoring drives the inactive-tab activity dot
setw -g monitor-activity on
set -g visual-activity off

# panes — active border uses the neon accent
set -g pane-border-style "fg=${theme_comment}"
set -g pane-active-border-style "fg=${theme_neon}"

# command/message bar
# tmux >= 3.7 draws the prompt/message as an overlay only as wide as its text
# unless the style carries `fill`; without it the rename/command prompt sat
# on top of the window chips instead of replacing the line (a work box, 3.7c).
set -g message-style "fg=${theme_bg},bg=${theme_lime},fill=${theme_lime}"
set -g message-command-style "fg=${theme_fg},bg=${theme_dark_gray},fill=${theme_dark_gray}"

# window tabs as rounded chips
setw -g window-status-separator " "
# baseline styles for inactive variants — keep all variants identical so activity/bell
# windows don't get tmux's default reverse-video (which renders them as grey pills)
setw -g window-status-style "fg=${theme_comment},bg=${theme_bg}"
setw -g window-status-activity-style "fg=${theme_comment},bg=${theme_bg}"
setw -g window-status-bell-style "fg=${theme_comment},bg=${theme_bg}"
setw -g window-status-last-style "fg=${theme_comment},bg=${theme_bg}"
# inactive: invisible caps (same color as bar bg) + lighter text — only text shows
setw -g window-status-format "#[fg=${theme_bg},bg=${theme_bg}]${chip_left}#[fg=${theme_type},bg=${theme_bg}] #I #W #[fg=${theme_bg},bg=${theme_bg}]${chip_right}"
# active: rounded chip in lime + bold dark text
setw -g window-status-current-format "#[fg=${theme_lime},bg=${theme_bg}]${chip_left}#[fg=${theme_bg},bg=${theme_lime},bold] #I #W #[fg=${theme_lime},bg=${theme_bg}]${chip_right}"

# status-left: host chip (#h, kitty's cursor colour) then session chip (sky; flips to butter while prefix is held)
set -g status-left "#[fg=${theme_cursor},bg=${theme_bg}]${chip_left}#[fg=${theme_bg},bg=${theme_cursor},bold] ${icon_host} #h #[fg=${theme_cursor},bg=${theme_bg}]${chip_right} #[fg=#{?client_prefix,${theme_butter},${theme_sky}},bg=${theme_bg}]${chip_left}#[fg=${theme_bg},bg=#{?client_prefix,${theme_butter},${theme_sky}},bold] #S #[fg=#{?client_prefix,${theme_butter},${theme_sky}},bg=${theme_bg}]${chip_right} "

# status-right: optional git-branch chip (lavender, only inside a repo) + cpu/mem/date chip
#
# NOTE: tmux expands $var itself inside a double-quoted config string, so every
# shell variable meant for the #() subshell must be escaped as \$ — an unescaped
# $b silently expanded to "" here and the branch chip never rendered.
#
# cpu/mem come from tmux-sysstat (one instant spawn) instead of the plugin's
# #{cpu}/#{mem}, whose psutil.cpu_percent(interval=1) blocked the status job for
# a full second and made the bar flicker.
set -g status-right "#(cd '#{pane_current_path}' 2>/dev/null && b=\$(git branch --show-current 2>/dev/null) && [ -n \"\$b\" ] && printf '#[fg=${theme_lavender},bg=${theme_bg}]${chip_left}#[fg=${theme_bg},bg=${theme_lavender},bold] ${icon_branch} %%s #[fg=${theme_lavender},bg=${theme_bg}]${chip_right} ' \"\$b\")#[fg=${theme_dark_gray},bg=${theme_bg}]${chip_left}#[fg=${theme_fg},bg=${theme_dark_gray}] #(${HOME}/.tmux/scripts/tmux-sysstat '${icon_cpu}' '${sep_dot}' '${icon_mem}') ${sep_dot} %a %d %b ${sep_dot} %H:%M #[fg=${theme_dark_gray},bg=${theme_bg}]${chip_right}"

#──────────────────────────────────────────────────────────────────────────────
# PLUGINS (TPM)
#──────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # navigate between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # automatically save sessions
# cpu/mem now come from ~/.tmux/scripts/tmux-sysstat (see status-right above) —
# this plugin's cpu.py blocks 1s per call, which flickered the status bar.
# set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # cpu and memory monitor

# resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'       # auto-restore last saved environment when tmux server starts
set -g @continuum-save-interval '15' # auto-save every 15 minutes

# initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
