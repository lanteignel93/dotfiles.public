# Kitty Configuration

# == FONT SETTINGS ==
font_family         JetBrainsMonoNL Nerd Font
# font_family         DankMono Nerd Font
# font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# Note: You can optionally define bold_font, italic_font, etc., but 'auto' is fine.
# bold_font JetBrainsMonoNL Nerd Font Bold
font_size 14.0

# == WINDOW APPEARANCE ==
initial_window_width 120c
initial_window_height 50c
window_padding_width 0
background_opacity 1.00
window_title_template "~~je suis terminal~~"

shell_integration enabled
confirm_os_window_close -1
shell /usr/bin/zsh
# Kitty handles the decoration via its own titlebar implementation or relies on the WM.
# decorations is not a kitty option.

# == CURSOR ==
cursor_shape block
# On means a positive value, -1 is default
cursor_blink_interval 0.5

# == COLORS ==
# Rendered by ~/dotfiles/theme from the palette; `dye <name>` re-points the link
# and recolours running windows over the socket below.
include ${HOME}/.config/theme/current/kitty.conf
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Enable the cursor trail
cursor_trail 100


# # == CURSOR TRAIL ==
# cursor_trail 3
# # Adjusted for a smoother fade-out
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
