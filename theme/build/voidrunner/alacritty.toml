# voidrunner — generated by ~/dotfiles/theme/render.py; do not edit
#
# Use: save this file next to alacritty.toml (Linux/macOS ~/.config/alacritty/,
# Windows %APPDATA%\alacritty\) as themes/voidrunner.toml, then in alacritty.toml:
#   [general]                            # 0.14+; older versions: a top-level import =
#   import = ["themes/voidrunner.toml"]    # relative to alacritty.toml
# With dye, import ~/.config/theme/current/alacritty.toml instead to follow `dye <name>`.

[colors.primary]
background = "#0d0d0d"
foreground = "#f1f1f1"

[colors.cursor]
text = "#1c1c1c"
cursor = "#bdfe58"

[colors.selection]
text = "#f1f1f1"
background = "#303030"

[colors.normal]
black = "#1c1c1c"
red = "#fa1100"
green = "#bdfe58"
yellow = "#ffffba"
blue = "#5eeeaf"
magenta = "#e5ccff"
cyan = "#7fa1c3"
white = "#ffffff"

[colors.bright]
black = "#585858"
red = "#fa1100"
green = "#bdfe58"
yellow = "#ffffba"
blue = "#5eeeaf"
magenta = "#e5ccff"
cyan = "#7fa1c3"
white = "#ffffff"

# UI: the same roles kitty uses, so search, hints and vi mode match the palette
[colors.vi_mode_cursor]
text = "#1c1c1c"
cursor = "#bdfe58"

[colors.search.matches]
foreground = "#1c1c1c"
background = "#5eeeaf"

[colors.search.focused_match]
foreground = "#1c1c1c"
background = "#bdfe58"

[colors.footer_bar]
foreground = "#c0c0c0"
background = "#262626"

[colors.hints.start]
foreground = "#1c1c1c"
background = "#ffffba"

[colors.hints.end]
foreground = "#1c1c1c"
