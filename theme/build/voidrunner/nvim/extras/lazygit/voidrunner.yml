# voidrunner — generated by ~/dotfiles/theme/render.py; do not edit
# appended through LG_CONFIG_FILE (comma-joined), after ~/.config/lazygit/config.yml
gui:
  theme:
    activeBorderColor:
      - "#bdfe58"
      - bold
    inactiveBorderColor:
      - "#585858"
    searchingActiveBorderColor:
      - "#ffffba"
      - bold
    optionsTextColor:
      - "#5eeeaf"
    selectedLineBgColor:
      - "#303030"
    inactiveViewSelectedLineBgColor:
      - "#262626"
    cherryPickedCommitBgColor:
      - "#3c3c3c"
    cherryPickedCommitFgColor:
      - "#bdfe58"
    unstagedChangesColor:
      - "#dea6a0"
    defaultFgColor:
      - "#c0c0c0"
  authorColors:
    "*": "#e5ccff"
  branchColorPatterns:
    "^main$": "#bdfe58"
    "^master$": "#bdfe58"
