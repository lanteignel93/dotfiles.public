# voidrunner — generated by ~/dotfiles/theme/render.py from palettes/voidrunner.toml; do not edit
# included by kitty.conf via: include ${HOME}/.config/theme/current/kitty.conf

background       #0d0d0d
foreground       #f1f1f1

cursor           #bdfe58
cursor_text_color #1c1c1c

selection_background #303030
selection_foreground #f1f1f1
url_color        #99ccff

# black · red · green · yellow · blue · magenta · cyan · white
color0  #1c1c1c
color1  #fa1100
color2  #bdfe58
color3  #ffffba
color4  #5eeeaf
color5  #e5ccff
color6  #7fa1c3
color7  #ffffff

# bright · color8 is the comment grey, not the panel, so dim CLI text stays visible
color8  #585858
color9  #fa1100
color10 #bdfe58
color11 #ffffba
color12 #5eeeaf
color13 #e5ccff
color14 #7fa1c3
color15 #ffffff

# tab bar and borders follow the panel
active_tab_foreground   #1c1c1c
active_tab_background   #bdfe58
inactive_tab_foreground #9e9e9e
inactive_tab_background #1c1c1c
active_border_color     #1bfd9c
inactive_border_color   #585858
