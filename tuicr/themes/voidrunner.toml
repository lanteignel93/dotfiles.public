# voidrunner for tuicr — generated by ~/dotfiles/theme/render.py; do not edit
# installed as ~/.config/tuicr/themes/voidrunner.toml; selected with `tuicr --theme voidrunner`

# Base panels & text
panel_bg = "#1c1c1c"
bg_highlight = "#303030"
fg_primary = "#c0c0c0"
fg_secondary = "#9e9e9e"
fg_dim = "#585858"

# Diff
diff_add = "#baffc9"
diff_add_bg = "#223b2b"
diff_del = "#ffb3ba"
diff_del_bg = "#3b2427"
diff_context = "#c0c0c0"
diff_hunk_header = "#99ccff"
expanded_context_fg = "#585858"

# Syntax-tinted diff backgrounds
syntax_add_bg = "#223b2b"
syntax_del_bg = "#3b2427"
syntax_theme = "voidrunner-syntax.tmTheme"

# File status
file_added = "#baffc9"
file_modified = "#ffffba"
file_deleted = "#ffb3ba"
file_renamed = "#e5ccff"

# Review progress
reviewed = "#1bfd9c"
pending = "#ffffba"

# Comment classifications
comment_note = "#7fa1c3"
comment_suggestion = "#5eeeaf"
comment_issue = "#dea6a0"
comment_praise = "#bdfe58"

# UI chrome
border_focused = "#bdfe58"
border_unfocused = "#585858"
status_bar_bg = "#1c1c1c"
cursor_color = "#bdfe58"
cursor_line_bg = "#262626"
branch_name = "#e5ccff"
help_indicator = "#585858"

# Inline messages (dark fg on saturated bg)
message_info_fg = "#1c1c1c"
message_info_bg = "#7fa1c3"
message_warning_fg = "#1c1c1c"
message_warning_bg = "#ffffba"
message_error_fg = "#1c1c1c"
message_error_bg = "#dea6a0"
update_badge_fg = "#1c1c1c"
update_badge_bg = "#bdfe58"

# Mode indicator
mode_fg = "#1c1c1c"
mode_bg = "#1bfd9c"
